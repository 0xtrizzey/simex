# Dependabot: weekly grouped updates; security updates come immediately via GitHub's automatic security fixes.
version: 2
updates:
  - package-ecosystem: "n"
    directory: "p"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "/"
    directory: ""
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        patterns: ["*"]
